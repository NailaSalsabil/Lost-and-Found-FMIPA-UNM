<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Barang - Lost and Found FMIPA</title>

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav class="navbar navbar-default">
    <div class="container">
        <a class="navbar-brand" href="index.html">Lost and Found FMIPA</a>
        <ul class="nav navbar-nav navbar-right">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="form.html?jenis=hilang">Laporkan Barang</a></li>
        </ul>
    </div>
</nav>

<div class="container halaman">

    <h2>Daftar Barang Hilang dan Temuan</h2>

    <div class="row">
        <div class="col-md-6">
            <input type="text" id="cariBarang"
                   class="form-control"
                   placeholder="Cari nama barang...">
        </div>

        <div class="col-md-6">
            <select id="filterGedung" class="form-control">
                <option value="">Semua Gedung</option>
            </select>
        </div>
    </div>

    <br>

    <div class="table-responsive">
        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Jenis</th>
                    <th>Nama Barang</th>
                    <th>Gedung</th>
                    <th>Lokasi</th>
                    <th>Tanggal</th>
                    <th>Detail</th>
                </tr>
            </thead>

            <tbody id="tabelLaporan">
                <tr>
                    <td colspan="7" class="text-center">
                        Memuat laporan...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<footer>
    <p>Lost and Found FMIPA UNM</p>
</footer>

<script src="assets/js/script.js"></script>

</body>
</html>
